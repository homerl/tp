name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install xxhash
        run: sudo apt-get update -y && sudo apt-get install -y xxhash
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
